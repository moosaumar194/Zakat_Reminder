
name: Build GiveBack APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          mkdir project
          unzip GiveBack-Android-Project.zip -d project

      - name: Add required Android dependency
        run: |
          sed -i '/implementation("androidx.activity:activity-compose:1.10.0")/a\    implementation("androidx.core:core-ktx:1.15.0")' project/app/build.gradle.kts

      - name: Build APK
        run: |
          gradle -p project :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GiveBack-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
